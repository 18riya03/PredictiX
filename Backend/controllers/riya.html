<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: aqua; color:blue;">
<h1>Learning iterative statements</h1>   
<script>
    var c=0;
var n=parseInt(prompt("Enter a no"));
for(var i=1; i<=n; i++)
{
    if(n%i==0)
    c++;
}
if(c==2)
document.write("prime no");
else
document.write("not a prime no");       
</script>
</body>
</html>
